[package]
name = "agent-kanban"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal Kanban board that dispatches cards via grok -p"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
